name: Build & Release Modern OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt
  REPO_BRANCH: main
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        device: [360v6, ax6600]

    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano p7zip p7zip-full patch pkgconf python3 python3-pip qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip xz-utils zlib1g-dev lib32gcc-s1 libc6-dev-i386
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "${{ env.TZ }}"

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "ROOT_DIR=$PWD" >> $GITHUB_ENV

    - name: Load Custom Feeds & Packages
      run: |
        chmod +x scripts/diy-script.sh
        cd openwrt
        ../scripts/diy-script.sh ${{ matrix.device }}

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        if [ -f configs/${{ matrix.device }}.config ]; then
          cp configs/${{ matrix.device }}.config openwrt/.config
        else
          echo "Error: configs/${{ matrix.device }}.config not found!" && exit 1
        fi
        cd openwrt
        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate Release Tag
      id: tag
      if: steps.compile.outputs.status == 'success'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        mkdir -p firmware_release
        find openwrt/bin/targets/ -type f -name "*sysupgrade.bin" -o -name "*factory.bin" -o -name "*initramfs-kernel.bin" | while read -r file; do
          filename=$(basename "$file")
          cp "$file" "firmware_release/${{ matrix.device }}-$filename"
        done
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware_${{ matrix.device }}
        path: firmware_release/*

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: needs.build.outputs.release_tag != ''
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./downloaded_artifacts

    - name: Flatten Artifacts Directory
      run: |
        mkdir -p release_assets
        find ./downloaded_artifacts -type f -exec cp {} ./release_assets/ \;
        echo "==== 准备上传的固件列表 ===="
        ls -lh ./release_assets/

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.build.outputs.release_tag }}
        name: OpenWrt 定制固件发布 [${{ needs.build.outputs.release_tag }}]
        body: |
          ## 🤖 自动化编译成功！
          基于官方分支定制的现代化 OpenWrt 固件。
          
          ### 📌 固件信息
          * **默认管理 IP**: `10.1.1.1`
          * **编译时间**: ${{ needs.build.outputs.release_tag }}
          * **包含的核心插件**: OpenClash, HomeProxy, DDNS-Go, Aria2, Aurora 极光主题等。
          * **内置特殊驱动**: 京东云雅典娜（LED屏幕控制）。
        draft: false
        prerelease: false
        files: ./release_assets/*
