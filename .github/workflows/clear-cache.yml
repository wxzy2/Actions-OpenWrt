name: 清理 Actions 编译缓存

on:
  workflow_dispatch: # 允许在 Actions 页面手动点击运行

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    steps:
      - name: 清理所有编译缓存
        uses: actions/github-script@v7
        with:
          script: |
            console.log("开始获取本仓库的所有缓存...");
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            if (caches.data.actions_caches.length === 0) {
              console.log("没有发现任何缓存，无需清理。");
              return;
            }

            for (const cache of caches.data.actions_caches) {
              console.log(`正在删除缓存: ${cache.key} (ID: ${cache.id})`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
            }
            console.log("所有缓存清理完毕！");
