name: Build Modern OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
  # push:
  #   branches:
    #   - main

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt
  REPO_BRANCH: main
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        device: [360v6, ax6600] # 矩阵定义两个机型

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano p7zip p7zip-full patch pkgconf python3 python3-pip qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip xreged xz-utils zlib1g-dev lib32gcc-s1 libc6-dev-i386
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "${{ env.TZ }}"

    - name: Clone source code
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "ROOT_DIR=$PWD" >> $GITHUB_ENV

    - name: Load Custom Feeds & Packages (Run Shared Script)
      run: |
        # 赋予脚本执行权限并运行，传入当前机型参数
        chmod +x scripts/diy-script.sh
        cd openwrt
        ../scripts/diy-script.sh ${{ matrix.device }}

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      run: |
        # 根据矩阵名称，将对应的 .config 复制到编译目录
        if [ -f configs/${{ matrix.device }}.config ]; then
          cp configs/${{ matrix.device }}.config openwrt/.config
        else
          echo "Error: configs/${{ matrix.device }}.config not found!" && exit 1
        fi
        cd openwrt
        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success'
      with:
        name: OpenWrt_firmware_${{ matrix.device }}
        path: openwrt/bin/targets/